<!DOCTYPE html> 
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Reminder 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFF0F5;
      --card-bg: #FFFFFF;
      --primary: #FFB7B2;
      --primary-hover: #FF9AA2;
      --accent: #E2F0CB;
      --text-color: #6C5B7B;
      --shadow: 0 8px 15px rgba(255, 183, 178, 0.2);
    }

    * {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 24px;
      color: #C7CEEA;
      text-shadow: 1px 1px 2px #B5EAD7;
    }

    .form-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
      border: 2px solid #FFDAC1;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #E2F0CB;
      border-radius: 12px;
      outline: none;
      background: #FAF8F5;
      color: var(--text-color);
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid var(--primary);
    }

    .card.prayer {
      border-left-color: #B5EAD7;
    }

    .card-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .card-info p {
      font-size: 12px;
      opacity: 0.8;
    }

    .actions button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Catatan Pengingat 🎀</h1>
  </header>

  <!-- FORM CRUD -->
  <div class="form-card">
    <input type="hidden" id="reminder-id">
    
    <div class="form-group">
      <label>Kategori</label>
      <select id="type" onchange="toggleFormFields()">
        <option value="calendar">📅 Kalender & Catatan</option>
        <option value="prayer">☪️ Jadwal Sholat</option>
      </select>
    </div>

    <div class="form-group">
      <label>Judul Catatan / Pengingat</label>
      <input type="text" id="title" placeholder="Contoh: Minum TTD 💊 / Beli Skincare 🛍️">
    </div>

    <!-- Field khusus Kalender -->
    <div id="calendar-fields">
      <div class="form-group">
        <label>Mode Pengulangan</label>
        <select id="repeat-mode" onchange="toggleDateField()">
          <option value="once">1 Kali Saja (Tanggal Tertentu)</option>
          <option value="daily">Berulang Setiap Hari (Tiap Hari)</option>
        </select>
      </div>

      <div class="form-group" id="date-group">
        <label>Tanggal Target</label>
        <input type="date" id="date">
      </div>
    </div>

    <!-- Field khusus Sholat -->
    <div id="prayer-fields" class="hidden">
      <div class="form-group">
        <label>Pilih Waktu Sholat</label>
        <select id="prayer-name">
          <option value="Subuh">Subuh</option>
          <option value="Dzuhur">Dzuhur</option>
          <option value="Ashar">Ashar</option>
          <option value="Maghrib">Maghrib</option>
          <option value="Isya">Isya</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Jam Pengingat</label>
      <input type="time" id="time">
    </div>

    <div class="form-group">
      <label>Catatan Tambahan</label>
      <textarea id="note" rows="2" placeholder="Detail catatan..."></textarea>
    </div>

    <button class="btn" onclick="saveReminder()">Simpan 🌸</button>
  </div>

  <!-- LIST DAFTAR REMINDER -->
  <div class="reminder-list" id="reminder-container"></div>

  <script>
    let reminders = JSON.parse(localStorage.getItem('my_reminders')) || [];

    if ("Notification" in window) {
      Notification.requestPermission();
    }

    function toggleFormFields() {
      const type = document.getElementById('type').value;
      if (type === 'calendar') {
        document.getElementById('calendar-fields').classList.remove('hidden');
        document.getElementById('prayer-fields').classList.add('hidden');
      } else {
        document.getElementById('calendar-fields').classList.add('hidden');
        document.getElementById('prayer-fields').classList.remove('hidden');
      }
    }

    function toggleDateField() {
      const mode = document.getElementById('repeat-mode').value;
      const dateGroup = document.getElementById('date-group');
      if (mode === 'daily') {
        dateGroup.classList.add('hidden');
      } else {
        dateGroup.classList.remove('hidden');
      }
    }

    // CRUD: CREATE & UPDATE
    function saveReminder() {
      const id = document.getElementById('reminder-id').value;
      const type = document.getElementById('type').value;
      const title = document.getElementById('title').value;
      const time = document.getElementById('time').value;
      const note = document.getElementById('note').value;
      const date = document.getElementById('date').value;
      const repeatMode = document.getElementById('repeat-mode').value;
      const prayerName = document.getElementById('prayer-name').value;

      if (!title || !time) {
        alert("Judul dan Jam harus diisi ya! ✨");
        return;
      }

      if (type === 'calendar' && repeatMode === 'once' && !date) {
        alert("Silakan pilih tanggalnya dulu ya! 📅");
        return;
      }

      const itemData = {
        id: id ? id : Date.now().toString(),
        type,
        title: type === 'prayer' ? `Sholat ${prayerName}` : title,
        time,
        note,
        repeatMode: type === 'calendar' ? repeatMode : 'daily',
        date: (type === 'calendar' && repeatMode === 'once') ? date : null,
        prayerName: type === 'prayer' ? prayerName : null,
        lastTriggered: null
      };

      if (id) {
        reminders = reminders.map(item => item.id === id ? itemData : item);
      } else {
        reminders.push(itemData);
      }

      localStorage.setItem('my_reminders', JSON.stringify(reminders));
      resetForm();
      renderReminders();
    }

    // CRUD: READ
    function renderReminders() {
      const container = document.getElementById('reminder-container');
      container.innerHTML = '';

      reminders.forEach(item => {
        const card = document.createElement('div');
        card.className = `card ${item.type}`;
        
        let modeLabel = '';
        if (item.type === 'calendar') {
          modeLabel = item.repeatMode === 'once' ? `📅 ${item.date}` : `🔄 Tiap Hari`;
        } else {
          modeLabel = `☪️ Pengingat Sholat`;
        }

        card.innerHTML = `
          <div class="card-info">
            <h3>${item.title}</h3>
            <p>${modeLabel} | ⏰ ${item.time}</p>
            <p><small>${item.note || ''}</small></p>
          </div>
          <div class="actions">
            <button onclick="editReminder('${item.id}')">✏️</button>
            <button onclick="deleteReminder('${item.id}')">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // CRUD: EDIT
    function editReminder(id) {
      const item = reminders.find(r => r.id === id);
      if (!item) return;

      document.getElementById('reminder-id').value = item.id;
      document.getElementById('type').value = item.type;
      document.getElementById('title').value = item.title;
      document.getElementById('time').value = item.time;
      document.getElementById('note').value = item.note;

      toggleFormFields();

      if (item.type === 'calendar') {
        document.getElementById('repeat-mode').value = item.repeatMode || 'once';
        toggleDateField();
        if (item.repeatMode === 'once') {
          document.getElementById('date').value = item.date;
        }
      } else {
        document.getElementById('prayer-name').value = item.prayerName;
      }
    }

    // CRUD: DELETE
    function deleteReminder(id) {
      reminders = reminders.filter(r => r.id !== id);
      localStorage.setItem('my_reminders', JSON.stringify(reminders));
      renderReminders();
    }

    function resetForm() {
      document.getElementById('reminder-id').value = '';
      document.getElementById('title').value = '';
      document.getElementById('time').value = '';
      document.getElementById('note').value = '';
      document.getElementById('date').value = '';
      document.getElementById('repeat-mode').value = 'once';
      toggleDateField();
    }

    // LOGIKA PENGECEKAN NOTIFIKASI
    setInterval(() => {
      const now = new Date();
      const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const currentDate = now.toISOString().split('T')[0];

      reminders.forEach(item => {
        if (item.time === currentTime && item.lastTriggered !== currentDate) {
          
          // Case 1: Mode Kalender 1 Kali Saja
          if (item.type === 'calendar' && item.repeatMode === 'once' && item.date === currentDate) {
            triggerNotification(item.title, item.note || "Ada jadwal untuk hari ini!");
            item.lastTriggered = currentDate;
            localStorage.setItem('my_reminders', JSON.stringify(reminders));
          } 
          
          // Case 2: Mode Kalender Berulang Setiap Hari (contoh: Minum TTD)
          else if (item.type === 'calendar' && item.repeatMode === 'daily') {
            triggerNotification(item.title, item.note || "Pengingat harian kamu~ 💊");
            item.lastTriggered = currentDate;
            localStorage.setItem('my_reminders', JSON.stringify(reminders));
          }

          // Case 3: Mode Sholat (Berulang Setiap Hari)
          else if (item.type === 'prayer') {
            triggerNotification(`Waktunya Sholat ${item.prayerName}! ☪️`, item.note || "Ayo siap-siap ambil wudhu~");
            item.lastTriggered = currentDate;
            localStorage.setItem('my_reminders', JSON.stringify(reminders));
          }
        }
      });
    }, 10000);

    function triggerNotification(title, body) {
      if (Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: "https://cdn-icons-png.flaticon.com/512/2913/2913520.png"
        });
      }
    }

    renderReminders();
  </script>
</body>
</html>
